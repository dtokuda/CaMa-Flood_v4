version: 6

cama:
  executable: /Users/dtokuda/work/model/CaMa-Flood_v4/src/MAIN_cmf
  map_dir: /Users/dtokuda/work/data/cmf_v420_pkg/map/glb_15min

reference_mapping:
  diminfo_path: diminfo_test-1deg.txt
  inpmat_path: inpmat_test-1deg.bin
  input_grid:
    type: global_regular_latlon
    longitude_order: west_to_east
    latitude_order: north_to_south

grid:
  type: rectilinear
  coverage: global
  bounds_policy: cf_or_derive
  hash_decimals: 7

preprocess:
  clip_negative: true
  use_areacella: false
  use_sftlf: false
  normalize_over_valid_area: false

output:
  dirname: MIROC6

input:
  path: /Users/dtokuda/work/data/cmip6/CMIP6/LS3MIP/MIROC/MIROC6/land-hist/r1i1p1f1/day/mrro/gn/v*/mrro_day_MIROC6_land-hist_r1i1p1f1_gn_*.nc
  variable: mrro

validation_forcing:
  use_input: true

